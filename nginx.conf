events {}
http {
    server {
        listen 80;
        listen 443 ssl http2;
        server_name app.example.com;
        ssl_certificate /etc/ssl/certs/nginx/default.crt;
        ssl_certificate_key /etc/ssl/certs/nginx/default.key;
        location / {
            proxy_pass http://node-app:8000;
        }
        access_log off;
        error_log /var/log/nginx/error.log error;
    }
}
